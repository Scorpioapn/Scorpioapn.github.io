<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>畅言中文议程生成器</title>
  <style>
    :root {
      color-scheme: light;
      --md-primary: #00527a;
      --md-on-primary: #ffffff;
      --md-primary-container: #c8e6ff;
      --md-on-primary-container: #001f2d;
      --md-secondary: #6a5842;
      --md-tertiary: #8f4a2f;
      --md-error: #b3261e;
      --md-surface: #fff9f0;
      --md-surface-dim: #eee1d2;
      --md-surface-container-low: #fff4e7;
      --md-surface-container: #f9ebdc;
      --md-surface-container-high: #f1e2d2;
      --md-surface-container-highest: #ead8c6;
      --md-on-surface: #211a15;
      --md-on-surface-variant: #665b52;
      --md-outline: #837568;
      --md-outline-variant: #d5c5b4;
      --tm-red: #772432;
      --white: #ffffff;
      --shadow-1: 0 1px 2px rgba(30, 20, 10, 0.10), 0 1px 3px rgba(30, 20, 10, 0.08);
      --shadow-2: 0 2px 6px rgba(30, 20, 10, 0.12), 0 8px 18px rgba(30, 20, 10, 0.08);
      --shadow-3: 0 8px 16px rgba(30, 20, 10, 0.12), 0 18px 34px rgba(30, 20, 10, 0.10);
      --radius-xs: 12px;
      --radius-sm: 16px;
      --radius-md: 24px;
      --radius-lg: 34px;
      --editor-width: 470px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--md-surface-dim);
      color: var(--md-on-surface);
      font-family: "MiSans", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei UI", "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    body {
      overflow: hidden;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    textarea {
      resize: vertical;
    }

    .app-shell {
      height: 100dvh;
      display: grid;
      grid-template-columns: var(--editor-width) minmax(0, 1fr);
      background:
        radial-gradient(circle at 8% 10%, rgba(0, 82, 122, 0.12), transparent 24%),
        radial-gradient(circle at 92% 4%, rgba(119, 36, 50, 0.10), transparent 22%),
        linear-gradient(135deg, #fbf0df 0%, #eee1d2 56%, #e8d8c7 100%);
    }

    .editor-shell {
      min-width: 0;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: rgba(249, 235, 220, 0.92);
      box-shadow: var(--shadow-2);
      z-index: 2;
    }

    .editor-header {
      padding: 18px 22px 14px;
      display: grid;
      gap: 14px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand-mark {
      width: 50px;
      height: 50px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      color: var(--md-on-primary);
      background: var(--md-primary);
      font-weight: 900;
      letter-spacing: 0;
      box-shadow: var(--shadow-2);
    }

    .brand-copy {
      min-width: 0;
      flex: 1;
    }

    .eyebrow {
      margin: 0 0 2px;
      color: var(--md-on-surface-variant);
      font-size: 12px;
      font-weight: 800;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      color: var(--md-primary);
      font-size: 30px;
      line-height: 1.08;
      font-weight: 900;
      letter-spacing: 0;
    }

    .header-actions,
    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .icon-button {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      color: var(--md-primary);
      background: var(--md-surface-container-low);
      box-shadow: var(--shadow-1);
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .icon-button:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-2);
      background: var(--md-surface);
    }

    .icon-button svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .editor-scroll {
      min-height: 0;
      overflow: auto;
      padding: 0 20px 28px;
      scrollbar-width: thin;
    }

    .surface-panel {
      padding: 22px;
      margin-bottom: 18px;
      border-radius: var(--radius-lg);
      background: var(--md-surface-container-low);
      box-shadow: var(--shadow-2);
    }

    .surface-panel.raised {
      background: var(--md-surface);
      box-shadow: var(--shadow-3);
    }

    .panel-title {
      margin-bottom: 16px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-title h2 {
      color: var(--md-primary);
      font-size: 24px;
      line-height: 1.15;
      font-weight: 900;
      letter-spacing: 0;
    }

    .panel-title .meta {
      color: var(--md-secondary);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field-grid.one {
      grid-template-columns: 1fr;
    }

    .field {
      min-width: 0;
      display: grid;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      color: var(--md-secondary);
      font-size: 13px;
      font-weight: 850;
    }

    .input,
    .textarea,
    .select {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 22px;
      padding: 0 18px;
      color: var(--md-on-surface);
      background: var(--md-surface);
      box-shadow: inset 0 0 0 1px rgba(102, 91, 82, 0.06), var(--shadow-1);
      outline: none;
      transition: box-shadow 160ms ease, background 160ms ease;
    }

    .textarea {
      min-height: 104px;
      padding: 16px 18px;
      line-height: 1.55;
    }

    .input:focus,
    .textarea:focus,
    .select:focus {
      background: #fffdf8;
      box-shadow: inset 0 0 0 3px rgba(0, 82, 122, 0.22), var(--shadow-2);
    }

    .input::placeholder,
    .textarea::placeholder {
      color: rgba(33, 26, 21, 0.42);
    }

    .helper-text {
      color: var(--md-on-surface-variant);
      font-size: 13px;
      line-height: 1.5;
    }

    .actions-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .button {
      min-height: 48px;
      padding: 0 20px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--md-primary);
      background: var(--md-surface);
      font-weight: 900;
      box-shadow: var(--shadow-1);
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease, color 160ms ease;
    }

    .button:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-2);
    }

    .button.filled {
      color: var(--md-on-primary);
      background: var(--md-primary);
    }

    .button.tonal {
      color: var(--md-on-primary-container);
      background: var(--md-primary-container);
    }

    .button.danger {
      color: var(--md-error);
      background: #fff3f1;
    }

    .button.subtle {
      box-shadow: none;
      background: transparent;
    }

    .button svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .rule-hint {
      margin-top: 12px;
      padding: 14px 16px;
      border-radius: var(--radius-md);
      color: var(--md-on-surface-variant);
      background: rgba(0, 82, 122, 0.07);
      font-size: 14px;
      line-height: 1.55;
    }

    .rule-hint strong {
      color: var(--md-primary);
    }

    .agenda-list {
      display: grid;
      gap: 10px;
    }

    .agenda-row {
      position: relative;
      min-height: 72px;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 12px 14px;
      border-radius: 28px;
      background: var(--md-surface);
      box-shadow: var(--shadow-1);
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .agenda-row:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-2);
    }

    .agenda-row.selected {
      background: var(--md-primary-container);
    }

    .agenda-row.dragging {
      opacity: 0.5;
      transform: scale(0.98);
    }

    .agenda-row.drop-target {
      box-shadow: inset 0 0 0 3px rgba(0, 82, 122, 0.30), var(--shadow-2);
    }

    .agenda-row.section {
      min-height: 58px;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      background: var(--md-surface-container-high);
    }

    .drag-handle {
      width: 38px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      color: var(--md-on-surface-variant);
      background: transparent;
      cursor: grab;
      user-select: none;
      font-size: 22px;
      line-height: 1;
    }

    .agenda-row:active .drag-handle {
      cursor: grabbing;
    }

    .agenda-main {
      min-width: 0;
    }

    .agenda-main.button {
      width: 100%;
      min-height: 0;
      padding: 0;
      display: block;
      text-align: left;
      border-radius: 0;
      box-shadow: none;
      background: transparent;
    }

    .agenda-main.button:hover {
      transform: none;
      box-shadow: none;
      background: transparent;
    }

    .agenda-title {
      margin-bottom: 3px;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 900;
      color: var(--md-on-surface);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .agenda-row.section .agenda-title {
      color: var(--md-primary);
    }

    .agenda-meta {
      color: var(--md-on-surface-variant);
      font-size: 13px;
      font-weight: 750;
      line-height: 1.35;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .agenda-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mini-button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      color: var(--md-primary);
      background: var(--md-surface-container);
      box-shadow: var(--shadow-1);
      font-size: 18px;
      font-weight: 900;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .mini-button:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-2);
    }

    .mini-button.danger {
      color: var(--md-error);
      background: #fff3f1;
    }

    .mini-button svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .preview-shell {
      min-width: 0;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
    }

    .preview-toolbar {
      padding: 18px 24px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .preview-title {
      min-width: 0;
    }

    .preview-title h2 {
      color: var(--md-primary);
      font-size: 24px;
      font-weight: 900;
      line-height: 1.2;
    }

    .preview-title p {
      margin-top: 4px;
      color: var(--md-on-surface-variant);
      font-size: 14px;
      font-weight: 700;
    }

    .status-chip {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      border-radius: 999px;
      color: var(--md-on-primary-container);
      background: var(--md-primary-container);
      font-weight: 900;
      white-space: nowrap;
      box-shadow: var(--shadow-1);
    }

    .preview-viewport {
      min-height: 0;
      overflow: auto;
      padding: 0 24px 32px;
      display: grid;
      place-items: start center;
      scrollbar-width: thin;
    }

    .agenda-sheet {
      width: min(100%, 980px);
      aspect-ratio: 210 / 297;
      margin: 8px auto 40px;
      padding: 28px;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      gap: 12px;
      color: #1f1a16;
      background: #fffdf8;
      box-shadow: 0 16px 45px rgba(31, 20, 10, 0.22);
      border-radius: 12px;
      overflow: hidden;
    }

    .sheet-header {
      display: grid;
      gap: 7px;
      padding-bottom: 10px;
      border-bottom: 2px solid #0a5b82;
    }

    .sheet-kicker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      color: #6a5842;
      font-size: 13px;
      font-weight: 850;
    }

    .sheet-title {
      color: #00527a;
      font-size: clamp(25px, 3vw, 34px);
      line-height: 1.12;
      font-weight: 950;
      letter-spacing: 0;
    }

    .sheet-chips {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .sheet-chip {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 11px;
      border-radius: 999px;
      color: #001f2d;
      background: #c8e6ff;
      font-size: 12px;
      font-weight: 900;
    }

    .sheet-chip.alt {
      color: #772432;
      background: #ffe0e6;
    }

    .sheet-meta {
      display: grid;
      grid-template-columns: 1.2fr 1.8fr 0.8fr 0.8fr;
      gap: 8px;
      font-size: 11px;
      line-height: 1.35;
      color: #4c4038;
      font-weight: 760;
    }

    .sheet-meta span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sheet-meta span:nth-child(2) {
      overflow: visible;
      white-space: normal;
    }

    .sheet-body {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(220px, 0.84fr);
      gap: 12px;
    }

    .print-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
      overflow: hidden;
      border-radius: 12px;
      background: #fff8ef;
    }

    .print-table th {
      padding: 7px 8px;
      color: #fff;
      background: #00527a;
      font-size: 10px;
      line-height: 1.2;
      text-align: left;
      font-weight: 900;
    }

    .print-table td {
      padding: 6px 8px;
      border-bottom: 1px solid rgba(106, 88, 66, 0.16);
      color: #211a15;
      font-size: 10px;
      line-height: 1.28;
      vertical-align: top;
      word-break: break-word;
    }

    .print-table tr:last-child td {
      border-bottom: 0;
    }

    .print-table .time-col {
      width: 13%;
      color: #00527a;
      font-weight: 900;
      white-space: nowrap;
    }

    .print-table .duration-col {
      width: 11%;
      text-align: center;
      font-weight: 850;
      white-space: nowrap;
    }

    .print-table .person-col {
      width: 18%;
      font-weight: 850;
    }

    .activity-title {
      display: block;
      margin-bottom: 2px;
      color: #111;
      font-size: 10.6px;
      font-weight: 950;
    }

    .activity-detail {
      color: #5d5048;
      white-space: pre-line;
    }

    .section-row td {
      padding: 7px 10px;
      color: #00527a;
      background: #e6f3ff;
      font-size: 11px;
      font-weight: 950;
    }

    .side-stack {
      min-height: 0;
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .side-box,
    .timing-box {
      padding: 10px;
      border-radius: 12px;
      background: #fff6eb;
      box-shadow: inset 0 0 0 1px rgba(106, 88, 66, 0.16);
    }

    .side-box h3,
    .timing-box h3 {
      margin: 0 0 5px;
      color: #00527a;
      font-size: 12px;
      line-height: 1.2;
      font-weight: 950;
    }

    .side-box p,
    .side-box li {
      color: #3f352f;
      font-size: 9px;
      line-height: 1.32;
      white-space: pre-line;
    }

    .side-box ul {
      margin: 0;
      padding-left: 14px;
    }

    .timing-box {
      padding: 9px 10px;
      background: #f9fbff;
    }

    .timing-grid {
      display: grid;
      grid-template-columns: 1.3fr repeat(4, 1fr);
      gap: 1px;
      overflow: hidden;
      border-radius: 8px;
      background: rgba(0, 82, 122, 0.14);
    }

    .timing-grid span {
      padding: 5px 6px;
      background: #fffdf8;
      font-size: 8.5px;
      line-height: 1.18;
    }

    .timing-grid .head {
      color: #fff;
      background: #00527a;
      font-weight: 900;
    }

    .sheet-foot {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 20;
      min-width: 260px;
      max-width: min(520px, calc(100vw - 32px));
      padding: 14px 16px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border-radius: 18px;
      color: #fff;
      background: #211a15;
      box-shadow: var(--shadow-3);
      transform: translateX(-50%);
      font-weight: 800;
    }

    .toast.open {
      display: flex;
    }

    .toast button {
      color: #c8e6ff;
      background: transparent;
      font-weight: 950;
    }

    @media (max-width: 1180px) {
      :root {
        --editor-width: 430px;
      }

      .agenda-sheet {
        padding: 22px;
      }
    }

    @media (max-width: 920px) {
      body {
        overflow: auto;
      }

      .app-shell {
        min-height: 100dvh;
        height: auto;
        grid-template-columns: 1fr;
      }

      .editor-shell,
      .preview-shell {
        height: auto;
        min-height: 0;
      }

      .editor-scroll,
      .preview-viewport {
        overflow: visible;
      }

      .preview-toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .agenda-sheet {
        width: min(100%, 760px);
        aspect-ratio: auto;
        min-height: 1020px;
      }
    }

    @media (max-width: 620px) {
      .editor-header,
      .editor-scroll,
      .preview-toolbar,
      .preview-viewport {
        padding-left: 12px;
        padding-right: 12px;
      }

      h1 {
        font-size: 25px;
      }

      .field-grid {
        grid-template-columns: 1fr;
      }

      .agenda-row {
        grid-template-columns: 32px minmax(0, 1fr);
      }

      .agenda-actions {
        grid-column: 2;
        justify-content: flex-start;
      }

      .agenda-sheet {
        padding: 14px;
      }

      .sheet-body,
      .sheet-foot {
        grid-template-columns: 1fr;
      }

      .sheet-meta {
        grid-template-columns: 1fr;
      }
    }

    @page {
      size: A4 portrait;
      margin: 7mm;
    }

    @media print {
      html,
      body {
        width: 210mm;
        min-height: 297mm;
        background: #fff;
        overflow: visible;
      }

      .editor-shell,
      .preview-toolbar,
      .toast {
        display: none !important;
      }

      .app-shell,
      .preview-shell,
      .preview-viewport {
        display: block;
        height: auto;
        padding: 0;
        background: #fff;
        overflow: visible;
      }

      .agenda-sheet {
        width: 196mm;
        height: 283mm;
        min-height: 0;
        aspect-ratio: auto;
        margin: 0;
        padding: 0;
        border-radius: 0;
        box-shadow: none;
        overflow: visible;
        page-break-inside: avoid;
      }

      .sheet-header {
        gap: 3px;
        padding-bottom: 5px;
        border-bottom-width: 1.4px;
      }

      .sheet-kicker {
        font-size: 7.2pt;
      }

      .sheet-title {
        font-size: 16.2pt;
        line-height: 1.04;
      }

      .sheet-chip {
        min-height: 17px;
        padding: 0 7px;
        font-size: 6.8pt;
      }

      .sheet-meta {
        gap: 4px;
        font-size: 6.6pt;
      }

      .sheet-body {
        gap: 6px;
        grid-template-columns: minmax(0, 2.18fr) minmax(168px, 0.72fr);
      }

      .print-table {
        border-radius: 8px;
      }

      .print-table th {
        padding: 3px 4px;
        font-size: 6.5pt;
      }

      .print-table td {
        padding: 3px 4px;
        font-size: 6.25pt;
        line-height: 1.12;
      }

      .activity-title {
        margin-bottom: 1px;
        font-size: 6.7pt;

      { keywords: ["颁奖", "分享"], duration: "5", recommendation: "5分钟" }
    ];

      printPage: document.querySelector("#printPage"),
      previewChip: document.querySelector("#previewChip"),
      agendaList: document.querySelector("#agendaList"),
      agendaCount: document.querySelector("#agendaCount"),

    let state = loadData();

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function loadData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return clone(DEFAULT_DATA);
        const parsed = JSON.parse(saved);
        return {
          ...clone(DEFAULT_DATA),
          ...parsed,
          items: Array.isArray(parsed.items) && parsed.items.length ? parsed.items : clone(DEFAULT_DATA.items)
        };
      } catch (error) {
        console.warn("Failed to load agenda data", error);
        return clone(DEFAULT_DATA);
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      els.saveStatus.textContent = "已自动保存";
      window.clearTimeout(saveData.timer);
      saveData.timer = window.setTimeout(() => {
        els.saveStatus.textContent = "本机已保存";
      }, 900);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDate(dateValue) {
      if (!dateValue) return "";
      const [year, month, day] = dateValue.split("-");
      if (!year || !month || !day) return dateValue;
      return `${Number(year)}年${Number(month)}月${Number(day)}日`;
    }

    function itemCount() {
      return state.items.filter((item) => item.kind !== "section").length;
    }

    function parseDurationMinutes(value) {
      const text = String(value || "").trim();
      if (!text) return 0;
      const range = text.match(/(\d+(?:\.\d+)?)\s*[-~]\s*(\d+(?:\.\d+)?)/);
      if (range) return Number(range[2]);
      const first = text.match(/(\d+(?:\.\d+)?)/);
      return first ? Number(first[1]) : 0;
    }

    function minutesToTime(totalMinutes) {
      const normalized = ((totalMinutes % 1440) + 1440) % 1440;
      const hours = Math.floor(normalized / 60);
      const minutes = normalized % 60;
      return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}`;
    }

    function timeToMinutes(value) {
      const [hours, minutes] = String(value || "").split(":").map(Number);
      if (!Number.isFinite(hours) || !Number.isFinite(minutes)) return 0;
      return hours * 60 + minutes;
    }

    function secondsToClock(seconds) {
      const safe = Math.max(0, Math.round(seconds));
      const minutes = Math.floor(safe / 60);
      const secs = safe % 60;
      return `${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    }

    function deriveTimingRule(minutes) {
      const total = Math.max(0, Number(minutes) || 0) * 60;
      if (!total) {
        return { green: 0, yellow: 0, red: 0, bell: 15, band: "请先输入分钟数" };
      }
      if (minutes <= 3) {
        return {
          green: Math.max(0, total - 60),
          yellow: Math.max(0, total - 30),
          red: total,
          bell: 15,
          band: "3分钟及以下"
        };
      }
      if (minutes <= 10) {
        return {
          green: Math.max(0, total - 120),
          yellow: Math.max(0, total - 60),
          red: total,
          bell: 30,
          band: "3-10分钟"
        };
      }
      return {
        green: Math.max(0, total - 300),
        yellow: Math.max(0, total - 120),
        red: total,
        bell: 30,
        band: "10分钟以上"
      };
    }

    function ruleTextForDuration(duration) {
      const minutes = parseDurationMinutes(duration);
      const rule = deriveTimingRule(minutes);
      if (!minutes) return "输入分钟数后自动推导绿牌、黄牌、红牌与铃声。";
      return `规则说明：${rule.band}，绿牌 ${secondsToClock(rule.green)}，黄牌 ${secondsToClock(rule.yellow)}，红牌 ${secondsToClock(rule.red)}，超时 ${rule.bell} 秒响铃。`;
    }

    function findDefaultByTitle(title) {
      const text = String(title || "");
      return DEFAULT_MATCHES.find((match) => match.keywords.some((keyword) => text.includes(keyword)));
    }

    function newId(prefix = "item") {
      return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
    }

    }

    function renderPreview() {
      const itemRows = state.items.map((item) => {
        if (item.kind === "section") {
          return `<tr class="section-row"><td colspan="4">${escapeHtml(item.title)}</td></tr>`;
        }
        return `
          <tr>
            <td class="time-col">${escapeHtml(item.time || "")}</td>
            <td>
              <span class="activity-title">${escapeHtml(item.title || "")}</span>
              ${item.detail ? `<span class="activity-detail">${escapeHtml(item.detail)}</span>` : ""}
            </td>
            <td class="duration-col">${escapeHtml(item.duration || "")}</td>
            <td class="person-col">${escapeHtml(item.person || "")}</td>
          </tr>
        `;
      }).join("");

      els.previewChip.textContent = `第 ${state.meetingNo || "-"} 期`;
      els.printPage.innerHTML = `
        <header class="sheet-header">
          <div class="sheet-kicker">
            <span>TOASTMASTERS INTERNATIONAL</span>
            <span>${escapeHtml(state.clubName)}</span>
          </div>
          <h2 class="sheet-title">${escapeHtml(state.clubName)} 第（${escapeHtml(state.meetingNo)}）期例会</h2>
          <div class="sheet-chips">
            <span class="sheet-chip">本期主题：${escapeHtml(state.theme)}</span>
            <span class="sheet-chip alt">今日一词：${escapeHtml(state.wordOfDay)}</span>
          </div>
          <div class="sheet-meta">
            <span>时间：${escapeHtml(formatDate(state.date))} ${escapeHtml(state.startTime)}-${escapeHtml(state.endTime)}</span>
            <span>地点：${escapeHtml(state.location)}</span>
            <span>例会经理：${escapeHtml(state.manager)}</span>
            <span>海报设计：${escapeHtml(state.posterDesigner)}</span>
          </div>
        </header>

        <section class="sheet-body">
          <div>
            <table class="print-table" aria-label="会议议程">
              <thead>
                <tr>
                  <th class="time-col">时间</th>
                  <th>活动内容</th>
                  <th class="duration-col">时长</th>
                  <th class="person-col">参与者</th>
                </tr>
              </thead>
              <tbody>${itemRows}</tbody>
            </table>
          </div>
          <aside class="side-stack">
            <section class="side-box">
              <h3>俱乐部介绍</h3>
              <p>${escapeHtml(state.clubIntro)}</p>
            </section>
            <section class="side-box">
              <h3>TM-PATHWAYS 学习路径</h3>
              <p>${escapeHtml(state.pathways)}</p>
            </section>
            <section class="side-box">
              <h3>本届役员</h3>
              <p>${escapeHtml(state.officers)}</p>
            </section>
            <section class="side-box">
              <h3>下期例会主题</h3>
              <p>${escapeHtml(state.nextTheme)}</p>
            </section>
          </aside>
        </section>

        <footer class="sheet-foot">
          <section class="timing-box">
            <h3>演讲时间守则</h3>
            <div class="timing-grid">
              <span class="head">类型</span><span class="head">绿牌</span><span class="head">黄牌</span><span class="head">红牌</span><span class="head">响铃</span>
              <span>3分钟及以下</span><span>剩余 1:00</span><span>剩余 0:30</span><span>时间到</span><span>超时 0:15</span>
              <span>3-10分钟</span><span>剩余 2:00</span><span>剩余 1:00</span><span>时间到</span><span>超时 0:30</span>
              <span>10分钟以上</span><span>剩余 5:00</span><span>剩余 2:00</span><span>时间到</span><span>超时 0:30</span>
            </div>
          </section>
          <section class="side-box">
            <h3>会议守则</h3>
            <p>${escapeHtml(state.meetingRules)}</p>
          </section>
        </footer>
      `;
    }

    function renderAgendaList() {
      els.agendaCount.textContent = `${itemCount()} 个项目`;
      els.agendaList.innerHTML = state.items.map((item, index) => {
        const isSection = item.kind === "section";
        const meta = isSection
          ? "分段标题"
          : `${item.time || "未定时间"} · ${item.duration || "未定时长"} · ${item.person || "未定参与者"}`;
        return `
          <div class="agenda-row ${isSection ? "section" : ""} ${editingId === item.id ? "selected" : ""}" data-id="${escapeHtml(item.id)}" draggable="true">
            <div class="drag-handle" title="拖动排序" aria-hidden="true">⋮</div>
            <button class="agenda-main button subtle" type="button" data-action="edit" data-id="${escapeHtml(item.id)}">
              <div class="agenda-title">${escapeHtml(item.title || "未命名")}</div>
              <div class="agenda-meta">${escapeHtml(meta)}</div>
            </button>
            <div class="agenda-actions">
              <button class="mini-button" type="button" data-action="duplicate" data-id="${escapeHtml(item.id)}" title="复制该项目" aria-label="复制该项目">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="10" height="10" rx="2"/><path d="M6 14H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v1"/></svg>
              </button>
              <button class="mini-button danger" type="button" data-action="delete" data-id="${escapeHtml(item.id)}" title="删除该项目" aria-label="删除该项目">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderRuleHint() {
      const title = els.agendaTitle.value.trim();
      const duration = els.agendaDuration.value.trim();
      const match = findDefaultByTitle(title);
      const defaultText = match ? `名称匹配：${match.keywords[0]}，推荐 ${match.recommendation}。` : "名称没有匹配默认时长，可手动输入。";
      els.ruleHint.innerHTML = `<strong>${escapeHtml(defaultText)}</strong><br>${escapeHtml(ruleTextForDuration(duration))}`;
    }

    function renderAll() {
      renderInputs();
      renderPreview();
      renderAgendaList();
      renderRuleHint();
    }

    function showToast(message, actionText, action) {
      window.clearTimeout(toastTimer);
      els.toastText.textContent = message;
      els.toastAction.textContent = actionText || "";
      els.toastAction.style.display = actionText ? "block" : "none";
      els.toastAction.onclick = action || null;
      els.toast.classList.add("open");
      toastTimer = window.setTimeout(() => els.toast.classList.remove("open"), actionText ? 6500 : 2800);
    }

    function clearAgendaForm() {
      editingId = null;
      els.agendaKind.value = "item";
      els.agendaTime.value = "";
      els.agendaTitle.value = "";
      els.agendaDuration.value = "";
      els.agendaPerson.value = "";
      els.agendaDetail.value = "";
      els.saveAgendaBtn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>添加项目';
      renderAgendaList();
      renderRuleHint();
    }

    function editAgendaItem(id) {
      const item = state.items.find((entry) => entry.id === id);
      if (!item) return;
      editingId = id;
      els.agendaKind.value = item.kind || "item";
      els.agendaTime.value = item.time || "";
      els.agendaTitle.value = item.title || "";
      els.agendaDuration.value = item.duration || "";
      els.agendaPerson.value = item.person || "";
      els.agendaDetail.value = item.detail || "";
      els.saveAgendaBtn.textContent = "保存修改";
      renderAgendaList();
      renderRuleHint();
    }

    function readAgendaForm() {
      const kind = els.agendaKind.value;
      return {
        id: editingId || newId(kind),
        kind,
        time: kind === "section" ? "" : els.agendaTime.value,
        title: els.agendaTitle.value.trim(),
        detail: kind === "section" ? "" : els.agendaDetail.value.trim(),
        duration: kind === "section" ? "" : els.agendaDuration.value.trim(),
        person: kind === "section" ? "" : els.agendaPerson.value.trim()
      };
    }

    function saveAgendaFromForm() {
      const item = readAgendaForm();
      if (!item.title) {
        showToast("请先填写活动内容");
        return;
      }
      if (editingId) {
        const index = state.items.findIndex((entry) => entry.id === editingId);
        if (index >= 0) state.items[index] = item;
        showToast("议程已更新");
      } else {
        state.items.push(item);
        showToast("已添加到议程");
      }
      saveData();
      renderPreview();
      clearAgendaForm();
    }

    function deleteAgendaItem(id) {
      const index = state.items.findIndex((item) => item.id === id);
      if (index < 0) return;
      const [item] = state.items.splice(index, 1);
      undoDelete = { item, index };
      if (editingId === id) clearAgendaForm();
      saveData();
      renderPreview();
      renderAgendaList();
      showToast(`已删除：${item.title}`, "撤销", () => {
        if (!undoDelete) return;
        state.items.splice(undoDelete.index, 0, undoDelete.item);
        undoDelete = null;
        saveData();
        renderAll();
        showToast("已恢复");
      });
    }

    function duplicateAgendaItem(id) {
      const index = state.items.findIndex((item) => item.id === id);
      if (index < 0) return;
      const cloneItem = { ...clone(state.items[index]), id: newId("copy") };
      state.items.splice(index + 1, 0, cloneItem);
      saveData();
      renderAll();
      showToast("已复制一条议程");
    }

    function reorderAgenda(sourceId, targetId) {
      if (!sourceId || !targetId || sourceId === targetId) return;
      const sourceIndex = state.items.findIndex((item) => item.id === sourceId);
      const targetIndex = state.items.findIndex((item) => item.id === targetId);
      if (sourceIndex < 0 || targetIndex < 0) return;
      const [moved] = state.items.splice(sourceIndex, 1);
      state.items.splice(targetIndex, 0, moved);
      saveData();
      renderAll();
      showToast("议程顺序已更新");
    }

    function rescheduleAgenda() {
      let cursor = timeToMinutes(state.startTime);
      state.items = state.items.map((item) => {
        if (item.kind === "section") return item;
        const duration = parseDurationMinutes(item.duration);
        const next = { ...item, time: minutesToTime(cursor) };
        cursor += Math.max(0, Math.round(duration));
        return next;
      });
      saveData();
      renderAll();
      showToast("已按时长重排时间");
    }

    function applyTitleDefault() {
      if (els.agendaKind.value === "section") {
        renderRuleHint();
        return;
      }
      const match = findDefaultByTitle(els.agendaTitle.value);
      if (match && !els.agendaDuration.value.trim()) {
        els.agendaDuration.value = match.duration;
      }
      renderRuleHint();
    }

    function getPlainText() {
      const lines = [
        `${state.clubName} 第（${state.meetingNo}）期例会`,
        `本期主题：${state.theme}  今日一词：${state.wordOfDay}`,
        `时间：${formatDate(state.date)} ${state.startTime}-${state.endTime}`,
        `地点：${state.location}`,
        `例会经理：${state.manager}  海报设计：${state.posterDesigner}`,
        "",
        "会议议程"
      ];
      state.items.forEach((item) => {
        if (item.kind === "section") {
          lines.push(`【${item.title}】`);
        } else {
          lines.push(`${item.time || "--:--"}  ${item.title}  ${item.duration || "-"}分钟  ${item.person || ""}`);
          if (item.detail) lines.push(`  ${item.detail}`);
        }
      });
      lines.push("", `下期例会主题：${state.nextTheme}`);
      return lines.join("\\n");
    }

    async function copyPlainText() {
      const text = getPlainText();
      try {
        await navigator.clipboard.writeText(text);
        showToast("文字版议程已复制");
      } catch (error) {
        const temp = document.createElement("textarea");
        temp.value = text;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        temp.remove();
        showToast("文字版议程已复制");
      }
    }

    function resetToDefault() {
      if (!confirm("恢复第 739 期样张会覆盖当前本机编辑内容，确定继续吗？")) return;
      state = clone(DEFAULT_DATA);
      editingId = null;
      saveData();
      clearAgendaForm();
      renderAll();
      showToast("已恢复 739 样张");
    }

    function bindEvents() {
      document.querySelectorAll("[data-field]").forEach((input) => {
        input.addEventListener("input", () => {
          state[input.dataset.field] = input.value;
          saveData();
          renderPreview();
        });
      });

      els.agendaKind.addEventListener("change", () => {
        const isSection = els.agendaKind.value === "section";
        [els.agendaTime, els.agendaDuration, els.agendaPerson, els.agendaDetail].forEach((input) => {
          input.disabled = isSection;
        });
        renderRuleHint();
      });
      els.agendaTitle.addEventListener("input", applyTitleDefault);
      els.agendaDuration.addEventListener("input", renderRuleHint);
      els.saveAgendaBtn.addEventListener("click", saveAgendaFromForm);
      els.clearAgendaFormBtn.addEventListener("click", clearAgendaForm);
      els.rescheduleBtn.addEventListener("click", rescheduleAgenda);

      els.agendaList.addEventListener("click", (event) => {
        const button = event.target.closest("[data-action]");
        if (!button) return;
        const id = button.dataset.id;
        const action = button.dataset.action;
        if (action === "edit") editAgendaItem(id);
        if (action === "delete") deleteAgendaItem(id);
        if (action === "duplicate") duplicateAgendaItem(id);
      });
      els.agendaList.addEventListener("dragstart", (event) => {
        const row = event.target.closest(".agenda-row");
        if (!row) return;
        dragId = row.dataset.id;
        row.classList.add("dragging");
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", dragId);
      });
      els.agendaList.addEventListener("dragover", (event) => {
        const row = event.target.closest(".agenda-row");
        if (!row || !dragId || row.dataset.id === dragId) return;
        event.preventDefault();
        row.classList.add("drop-target");
      });
      els.agendaList.addEventListener("dragleave", (event) => {
        event.target.closest(".agenda-row")?.classList.remove("drop-target");
      });
      els.agendaList.addEventListener("drop", (event) => {
        const row = event.target.closest(".agenda-row");
        if (!row) return;
        event.preventDefault();
        reorderAgenda(dragId, row.dataset.id);
        dragId = null;
      });
      els.agendaList.addEventListener("dragend", () => {
        dragId = null;
        document.querySelectorAll(".agenda-row").forEach((row) => row.classList.remove("dragging", "drop-target"));
      });

      [els.printBtn, els.printBtnSide].forEach((button) => button.addEventListener("click", () => window.print()));
      [els.copyBtn, els.copyBtnTop].forEach((button) => button.addEventListener("click", copyPlainText));
      els.resetBtn.addEventListener("click", resetToDefault);
      els.openTimekeeperBtn.addEventListener("click", () => {
        window.location.href = "index.html";
      });
    }

    bindEvents();
    renderAll();
  </script>
</body>
</html>
