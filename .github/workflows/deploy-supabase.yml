name: Deploy Supabase Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: supabase-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: nixguazietjzvcztbueh
  AGENDA_ALLOWED_ORIGIN: https://scorpioapn.github.io

jobs:
  deploy:
    name: Test, deploy, and smoke-test Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run static tests
        run: npm test

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required deployment secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing GitHub secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Dry-run database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --linked --dry-run --yes

      - name: Deploy agenda Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if supabase functions deploy agenda-drafts --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api; then
              exit 0
            fi
            echo "Supabase function deploy failed on attempt ${attempt}; retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Push database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --linked --yes

      - name: Smoke-test live agenda sync
        run: npm run smoke:supabase
